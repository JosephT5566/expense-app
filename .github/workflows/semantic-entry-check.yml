name: Semantic Entry Check

on:
    pull_request:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    backend:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              with:
                  version: '0.12.7'
                  enable-cache: true
                  cache-dependency-glob: services/semantic-entry/uv.lock
            - run: uv sync --project services/semantic-entry --locked
            - run: uv run --directory services/semantic-entry --locked pytest
            - run: uv run --directory services/semantic-entry --locked ruff check .
            - run: uv run --directory services/semantic-entry --locked ruff format --check .
            - run: cd services/semantic-entry && uv run --locked mypy
            - run: uv run --directory services/semantic-entry --locked python -m semantic_entry.evaluation --mode fixture --out /tmp/jopie-semantic-eval
            - run: docker build -f services/semantic-entry/Dockerfile -t jopie-semantic-entry .
            - run: services/semantic-entry/scripts/container-smoke.sh
            - name: Verify captured public baseline and semantic migration chain
              run: services/semantic-entry/scripts/baseline-db-test.sh
            - uses: supabase/setup-cli@v3
              with:
                  version: 2.120.0
            - name: Start disposable Supabase and install synthetic schema before draft RPC
              run: |
                  supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1
                  docker exec -i supabase_db_jopie-semantic-entry-test psql -U postgres -v ON_ERROR_STOP=1 < supabase/fixtures/semantic-entry-test-schema.sql
                  docker exec -i supabase_db_jopie-semantic-entry-test psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/202610120001_semantic_entry.sql
                  supabase status -o env > "$RUNNER_TEMP/semantic-supabase.env"
            - name: Disposable integration tests only
              run: |
                  set -a
                  source "$RUNNER_TEMP/semantic-supabase.env"
                  set +a
                  TEST_SUPABASE_URL="$API_URL" uv run --directory services/semantic-entry --locked pytest -o addopts="" tests/test_db_integration.py
            - name: Stop disposable stack
              if: always()
              run: supabase stop --no-backup

    frontend:
        # Playwright 1.59.1 supports Ubuntu 24.04; avoid ubuntu-latest OS upgrades.
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        env:
            PUBLIC_SUPABASE_URL: https://synthetic.supabase.co
            PUBLIC_SUPABASE_PUBLISHABLE_KEY: synthetic-publishable-key
            PUBLIC_EMAIL_NAME_MAPPING: '{}'
            PUBLIC_GOOGLE_AI_GCF: https://receipt.example.test
            PUBLIC_SEMANTIC_ENTRY_URL: https://semantic.example.test
            BASE_PATH: ''
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              with:
                  version: '0.12.7'
            - run: uv sync --project services/semantic-entry --locked
            - run: node --experimental-strip-types packages/semantic-entry-contract/tests/python-parity.mjs
            - run: npm ci
            - run: npm run check
            # Whole-repository Prettier has a pre-existing baseline failure; scope is explicit.
            - name: Semantic change formatting and lint
              run: |
                  npx prettier --check packages/semantic-entry-contract src/lib/data/semantic-entry.fetcher.ts src/lib/data/expenses.fetcher.ts src/lib/components/semantic-entry src/routes/+page.svelte e2e/semantic-entry.test.ts
                  npx eslint packages/semantic-entry-contract/src src/lib/data/semantic-entry.fetcher.ts src/lib/data/expenses.fetcher.ts src/lib/components/semantic-entry src/routes/+page.svelte e2e/semantic-entry.test.ts
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e -- e2e/semantic-entry.test.ts e2e/daily-carousel.test.ts
            - name: Verify semantic entry under Pages base path
              env:
                  BASE_PATH: /expense-app
                  E2E_BASE_PATH: /expense-app
              run: npm run test:e2e -- e2e/semantic-entry.test.ts
