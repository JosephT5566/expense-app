[project]
name = "jopie-semantic-entry"
version = "0.1.0"
description = "Caller-scoped semantic expense entry service"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "google-cloud-storage>=3.17.1,<4",
    "google-genai>=2.33,<3",
    "httpx>=0.28,<0.29",
    "langgraph>=1.0,<2",
    "langsmith>=0.14,<1",
    "starlette>=0.52,<1",
    "uvicorn>=0.40,<1",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.14,<1", "mypy>=1.19,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--ignore=tests/test_db_integration.py"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
files = ["semantic_entry"]

[tool.hatch.build.targets.wheel]
packages = ["semantic_entry"]
